name: Build LTO/CFI Kernel Module (Official Google AOSP Clang)

on:
  workflow_dispatch:
  push:
    paths:
      - 'test_module/**'
      - '.github/workflows/main.yml'

jobs:
  build-module:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libelf-dev libssl-dev python3 lld

      - name: Setup Official Google AOSP Clang (r596125)
        run: |
          echo "Baixando toolchain oficial do Google (clang-r596125) na VM..."
          rm -rf $HOME/aosp-clang
          git clone --depth=1 --filter=blob:none --sparse https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 $HOME/aosp-clang
          cd $HOME/aosp-clang
          git sparse-checkout set clang-r596125
          
          echo "$HOME/aosp-clang/clang-r596125/bin" >> $GITHUB_PATH

      - name: Verify Official Clang Version
        run: |
          export PATH="$HOME/aosp-clang/clang-r596125/bin:$PATH"
          clang --version

      - name: Create Test Module Source (Fallback if folder not present)
        run: |
          if [ ! -d "test_module" ]; then
            mkdir -p test_module
            cat << 'EOF' > test_module/hello_test.c
          #include <linux/init.h>
          #include <linux/module.h>
          #include <linux/kernel.h>

          MODULE_LICENSE("GPL");
          MODULE_AUTHOR("djfjfjfjjf");
          MODULE_DESCRIPTION("Moto G30 sm6225 Official Clang LTO/CFI Test Module");

          static int __init hello_init(void) {
              pr_info("hello_test: modulo compilado com AOSP Clang oficial carregado com sucesso!\n");
              return 0;
          }

          static void __exit hello_exit(void) {
              pr_info("hello_test: modulo finalizado.\n");
          }

          module_init(hello_init);
          module_exit(hello_exit);
          EOF

            cat << 'EOF' > test_module/Makefile
          obj-m += hello_test.o
          EOF
          fi

      - name: Prepare Kernel Headers & Build Module with LLVM
        run: |
          echo "Procurando defconfig do bengal-perf..."
          CONFIG_PATH=$(find arch/arm64/configs -name "bengal-perf_defconfig" -o -name "*bengal-perf*defconfig" | head -n 1)
          
          if [ -z "$CONFIG_PATH" ]; then
            echo "Erro crítico: Nenhum defconfig 'bengal-perf_defconfig' foi encontrado!"
            find arch/arm64/configs -maxdepth 3
            exit 1
          fi

          DEFCONFIG=$(echo "$CONFIG_PATH" | sed 's|arch/arm64/configs/||')
          echo "Usando defconfig: $DEFCONFIG"

          # Compilação estrita com LLVM=1 e LLVM_IAS=1 usando o Clang oficial r596125 do Google
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 $DEFCONFIG
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 modules_prepare
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 M=test_module modules

      - name: Upload Compiled .ko Artifact
        uses: actions/upload-artifact@v4
        with:
          name: moto-g30-official-clang-module
          path: out/test_module/*.ko
          if-no-files-found: error
