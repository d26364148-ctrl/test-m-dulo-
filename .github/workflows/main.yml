name: Build Moto G30 Kernel (Official Google AOSP Clang)

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - 'README.md'

jobs:
  build-kernel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libelf-dev libssl-dev python3 lld

      - name: Setup Official Google AOSP Clang (r596125)
        run: |
          echo "Baixando toolchain oficial do Google (clang-r596125)..."
          git clone --depth=1 --filter=blob:none --sparse https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 $HOME/aosp-clang
          cd $HOME/aosp-clang
          git sparse-checkout set clang-r596125
          
          echo "$HOME/aosp-clang/clang-r596125/bin" >> $GITHUB_PATH

      - name: Verify Official Clang Version
        run: |
          clang --version

      - name: Configure Kernel for Moto G30 (caprip)
        run: |
          echo "Criando diretório out e combinando os arquivos de configuração..."
          mkdir -p out
          
          cat arch/arm64/configs/vendor/bengal-perf_defconfig \
              arch/arm64/configs/vendor/ext_config/moto-bengal.config \
              arch/arm64/configs/vendor/ext_config/caprip-default.config \
              arch/arm64/configs/vendor/debugfs.config > out/.config

          echo "Executando olddefconfig para sincronizar o .config..."
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig

      - name: Build Full Kernel Image with LLVM
        run: |
          echo "Iniciando a compilação do kernel (Image) limitada a 3 núcleos..."
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 -j3

      - name: Upload Kernel Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: moto-g30-kernel-image
          path: out/arch/arm64/boot/Image
          if-no-files-found: error
